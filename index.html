html{font-size:calc(18px * var(--size))}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;line-height:1.55}

.hud button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#pop{position:absolute;left:0;top:100%;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:6px}
.pp{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px;padding:4px 12px;font-size:.9rem;animation:rise 1.8s ease forwards}

header{padding:10px 0 0}
header h1{font-size:1.25rem;margin:0}
header .sub{color:var(--mute);font-size:.85rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
nav button{flex:1 1 auto;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:700;cursor:pointer;padding:6px 10px}
nav button[aria-current=page]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
#owl{flex:0 0 92px;padding-top:4px}
#owl svg{width:92px;height:88px;display:block;shape-rendering:crispEdges}
#owl.hop svg{animation:hop .45s ease 3}
#owl.bob svg{animation:bob 3.2s ease-in-out infinite}
#owl.tilt svg{transform:rotate(-10deg)}
@keyframes hop{50%{transform:translateY(-9px)}}
@keyframes bob{50%{transform:translateY(-2px)}}
.sbox{flex:1}
#bubble{position:relative;margin:0 0 8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.95rem}
#bubble::before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.sbtns button{min-height:44px;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;font:inherit;font-weight:700;cursor:pointer;padding:4px 14px;margin:0 8px 6px 0}
.scene{border:2px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--accent) 9%,var(--card));margin-bottom:14px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto;max-height:110px;shape-rendering:crispEdges}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.chat{border-color:var(--accent)}
.log{max-height:240px;overflow-y:auto;padding-right:4px}
.msg{margin:6px 0;padding:8px 12px;border-radius:12px;max-width:92%;font-size:.95rem}
.msg.owl{background:var(--soft)}
.msg.you{background:var(--accent);color:var(--accent-ink);margin-left:auto}
.chips button{min-height:44px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.askrow{display:flex;gap:8px;margin-top:8px}
.askrow input{flex:1}
h2{font-size:1.35rem;margin:0 0 8px}
h2.sec{margin:22px 0 8px}
h3{font-size:1.1rem;margin:16px 0 6px}
p{margin:8px 0}
.mute{color:var(--mute)}.small{font-size:.85rem}
button.btn,a.btn{display:inline-block;min-height:52px;padding:10px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:6px 8px 6px 0}
button.btn.alt{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.blocks{display:flex;gap:4px;margin:4px 0 12px}
.blocks i{width:18px;height:10px;background:var(--line);display:block}
.blocks i.on{background:var(--accent)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute);margin:0 6px 6px 0}
.tag.v{border-color:var(--know);color:var(--know)}
.tip{background:var(--soft);border-left:5px solid var(--accent);padding:10px 14px;border-radius:6px;margin:12px 0}
.warn{border:2px solid var(--review);padding:8px 12px;border-radius:8px;margin:10px 0}
ol.chain{list-style:none;margin:12px 0;padding:0}

ol.chain li:not(:last-child)::after{content:"\2193";position:absolute;left:14px;bottom:-22px;color:var(--accent);font-size:1.1rem}
.qtext{font-size:1.2rem;font-weight:700;margin:6px 0 14px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:56px;margin:8px 0;padding:12px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}

.choice.right{border-color:var(--know);border-width:3px}
.choice.wrong{border-color:var(--revisit);border-width:3px}
.choice .mk{display:block;font-weight:700;font-size:.85rem;margin-top:2px}
.choice:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;border:2px solid currentColor}
.pill.know{color:var(--know)}.pill.review{color:var(--review)}.pill.revisit{color:var(--revisit)}.pill.new{color:var(--mute)}
.mod{display:flex;flex-direction:column;gap:6px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--know)}
input[type=search],input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.term{border-top:1px solid var(--line);padding:10px 0}
.term b{font-size:1.05rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
label.row{display:flex;gap:12px;align-items:center;min-height:48px}
label.row input{width:24px;height:24px}
.cols{columns:2 240px;column-gap:24px}
.cols div{break-inside:avoid;margin-bottom:6px}
.flash{text-align:center}
.flash .big{font-size:2rem;font-weight:700;margin:14px 0}
.tiles{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.tiles i{font-style:normal;font-size:.7rem;padding:3px 6px;border:2px solid var(--line);border-radius:4px;color:var(--mute)}
.tiles i.know{border-color:var(--know);color:var(--know);font-weight:700}
.tiles i.review{border-color:var(--review);color:var(--review)}
.tiles i.revisit{border-color:var(--revisit);color:var(--revisit)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid button{min-height:56px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer;padding:8px 10px;text-align:left}
.mgrid button.sel{border-color:var(--accent);border-width:3px}
.mgrid button.ok{border-color:var(--know);color:var(--know);font-weight:700}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.cert{border:6px double var(--accent);padding:28px 18px;text-align:center}
.cert .name{font-size:1.8rem;font-weight:700;margin:10px 0;border-bottom:2px solid var(--line);display:inline-block;min-width:60%}
.cert svg{width:64px;height:62px;shape-rendering:crispEdges}
footer{font-size:.8rem;color:var(--mute);margin-top:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.still *{animation:none!important}
@media print{
 body{background:#fff;color:#000}
 .hud,header,nav,.stage,#chat,footer,.noprint,button,.scene,details{display:none!important}
 #app>.card:not(.printable){display:none!important}
 .card{border:0;padding:0;margin:0 0 10px}
 .cert{border:6px double #000;padding:30px}
 .wrap{padding:0;max-width:none}
 html{font-size:12px}
 textarea{border:1px solid #888;min-height:50px}
}
</style>

<script>
(function(){
var BUILTIN = {

title:"Risk Lead in Solar + Storage: intro and interview prep",
certTitle:"Introduction to Risk Management in Solar and Battery Infrastructure",
modules:[
 {id:"m0",kind:"core",title:"Big picture: who is who",blurb:"No background needed. The whole system in five minutes.",terms:["Grid","Utility","Load","Developer","Operator"]},
 {id:"m1",kind:"core",title:"What is Qcells?",blurb:"Who they are, what they build, and one real news event.",terms:["EPC","Vertical integration","Ingot","UFLPA","CBP","Furlough"]},
 {id:"m2",kind:"core",title:"Electricity basics",blurb:"Volts, amps, MW vs MWh, DC vs AC.",terms:["MW","MWh","GW","DC","AC","MWdc / MWac"]},
 {id:"m3",kind:"core",title:"Solar panels 101",blurb:"From sunlight to the grid, step by step.",terms:["PV","Module (panel)","Inverter","String","Tracker","Capacity factor"]},
 {id:"m4",kind:"core",title:"Battery storage (BESS) hookup",blurb:"Every component, in order.",terms:["BESS","BMS","PCS","EMS","LFP","SOC"]},
 {id:"m5",kind:"core",title:"SCADA deep dive",blurb:"How operators watch and control a plant.",terms:["SCADA","HMI","PLC","RTU","PPC","Historian"]},
 {id:"m6",kind:"core",title:"IT vs OT vs OTA",blurb:"Three look-alike terms, and security.",terms:["IT","OT","OTA","DMZ","Segmentation"]},
 {id:"m7",kind:"core",title:"Project words",blurb:"Phases, contracts, grid connection, money.",terms:["POI","COD","PPA","LNTP","LDs","Contingency"]},
 {id:"m8",kind:"core",title:"Risk basics",blurb:"How a Risk Lead thinks and talks.",terms:["Risk register","Likelihood","Impact","Mitigation","Residual risk","Leading indicator"]},
 {id:"d1",kind:"explore",title:"Deep dive: three-phase and voltage levels",blurb:"Why plants step voltage up, and what that means for risk.",terms:["Three-phase","kV","Medium voltage","High voltage","Collector substation"]},
 {id:"d2",kind:"explore",title:"Deep dive: protection and grounding",blurb:"Fuses, breakers, relays, faults, and safety.",terms:["Fault","Breaker","Relay","Fuse","Grounding","Arc flash"]},
 {id:"d3",kind:"explore",title:"Deep dive: reading a one-line diagram",blurb:"The electrical map of a plant.",terms:["One-line diagram","Bus","Feeder","As-built"]},
 {id:"d4",kind:"explore",title:"Deep dive: the grid, frequency, and inverters",blurb:"Why solar and batteries behave differently from spinning generators.",terms:["Frequency","Inertia","IBR","Grid-following","Grid-forming","Reactive power"]},
 {id:"e1",kind:"explore",title:"Interview toolkit",blurb:"How to tell your story and handle unknown terms.",terms:["STAR","Behavioral question","Follow-up question"]}
],
lessons:{
 m0:[
  {t:"The big idea",tag:"g",chain:["Sun or battery","Panels or battery racks","Inverter or PCS (converts power)","Transformer (raises voltage)","Grid (the shared network)","Homes and businesses (the load)"],b:["Solar panels make electricity. Batteries store it.","Wires, transformers, and switches carry it to the grid.","People and software watch it and keep it safe."]},
  {t:"Who is who",tag:"g",b:["Developer: finds the site, gets permits and grid permission.","Owner or investor: pays for the plant and owns it.","EPC contractor: designs it, buys the equipment, builds it.","Equipment makers: panels, batteries, inverters.","Utility or grid operator: runs the grid the plant connects to.","Operator: runs and repairs the plant after it is built."],tip:"One company can play several roles. Qcells makes panels and does EPC work, and has also developed projects."},
  {t:"Why risk matters",tag:"g",b:["These projects are big, expensive, and take years.","Delays, defects, and surprises cost money and can hurt safety.","A Risk Lead asks: what could go wrong, and who owns the fix?"]},
  {t:"Words you will meet first",tag:"g",b:["MW: how fast power flows. MWh: how much energy is stored.","EPC: engineering, procurement, construction.","BESS: a big battery plant. SCADA: the screens that run it.","POI: the spot where the plant meets the grid."],tip:"Do not memorize these now. Each gets its own lesson."},
  {t:"How this course works",tag:"g",b:["Each topic has a lesson, a few key terms, and a short quiz.","Say \"Not yet\" when you do not know a term. That is how learning works.","Your owl helper can explain anything. Tap Ask Owlchi."]}
 ],
 m1:[
  {t:"The short version",tag:"v",b:["Qcells makes solar panels.","It also designs and builds whole solar power plants, and big battery plants.","Its US business for this work is based in Houston."]},
  {t:"EPC: the key word",tag:"v",b:["EPC = Engineering, Procurement, Construction.","Engineering: design it. Procurement: buy the equipment. Construction: build it.","Qcells does all three, and makes many of its own panels."]},
  {t:"The factories",tag:"v",b:["Two factories in Georgia: Dalton and Cartersville.","Cartersville is built to make the whole chain: ingot, wafer, cell, module. Making every step in-house is called vertical integration.","Company target: about 8.6 GW of panels a year by the end of Q3 2026. One outlet says 8.4 GW. If unsure, say \"roughly 8.5 GW\".","GW = gigawatt = 1,000 megawatts."]},
  {t:"A real project: Atlas V and VI",tag:"v",b:["Two solar plants in Arizona, about 372 MWdc together (237 + 135).","Qcells developed them, sold them, then did the EPC work and supplied panels and racking.","Power is sold under long-term contracts to Southern California Edison.","One buyer announcement lists about 357 MWdc. Numbers differ by source."]},
  {t:"What happened, in order",tag:"v",chain:["2025: US Customs starts holding imported solar cells","Why it hurt: Georgia panel lines needed cells that came from overseas","Nov 2025: Qcells furloughs 1,000 Georgia workers","Mar 2026: normal production returns"],b:["UFLPA is a US law that bans imports tied to forced labor. CBP is the agency that checks imports at the border.","Qcells says its cells contained no material from the Xinjiang region."]},
  {t:"Why this matters to a Risk Lead",tag:"g",b:["One supply link stopped, and factories slowed. That is a single point of dependency.","Early warning signs: shipment holds, requests for paperwork, rule changes.","A Risk Lead asks: what is Plan B if a shipment is stopped, and who owns it?"],tip:"In an interview, talk about the risk and the plan. Do not blame anyone."},
  {t:"The job in one line",tag:"g",b:["Risk Lead = find what could go wrong on big projects, rate it, and make sure someone owns the fix.","You do not need to be a solar engineer. You need to ask good questions and track the answers."],tip:"Not yet checked: the job posting text itself. Save the posting and compare it to this course."}
 ],
 m2:[
  {t:"Four words",tag:"g",b:["Voltage (V): the push. Like water pressure.","Current (A): the flow. Like water per second.","Power (W): how fast energy moves. Voltage x current.","Energy (Wh): power x time."]},
  {t:"Sizes",tag:"g",b:["1 kW = 1,000 W. 1 MW = 1,000 kW. 1 GW = 1,000 MW.","Plants are measured in MW. Batteries are measured in MWh."]},
  {t:"Power vs energy",tag:"g",b:["MW is how fast. MWh is how much.","100 MW for 4 hours = 400 MWh."],tip:"Car picture: MW is how hard you press the gas. MWh is the size of the fuel tank."},
  {t:"DC vs AC",tag:"g",b:["DC flows one way: solar panels, batteries.","AC flips back and forth: the grid, wall outlets.","An inverter (or PCS) converts between them."]},
  {t:"MWdc vs MWac",tag:"g",b:["MWdc = the panel rating.","MWac = what the inverters can send to the grid.","MWdc is usually bigger than MWac."],tip:"Always ask which one a number means."},
  {t:"If you know building systems",tag:"g",b:["Breakers, transformers, and switchgear work the same way in a plant as in a large building. The plant is just bigger."]}
 ],
 m3:[
  {t:"The whole chain",tag:"g",chain:["Sun","Cell","Panel (module)","String of panels","Combiner box","Inverter (DC to AC)","Transformer","Substation","POI (connection point)","Grid"],b:["Everything before the inverter is DC."]},
  {t:"Cell, panel, string",tag:"g",b:["PV = photovoltaic: turns light into electricity.","Many cells make one panel (also called a module).","Panels wired in a row make a string."]},
  {t:"Inverter",tag:"g",b:["Changes DC to AC.","Modern inverters also help hold grid voltage steady."]},
  {t:"Racking and trackers",tag:"g",b:["Racking: the steel frame holding panels.","Tracker: a motor that tilts panels to follow the sun.","More energy, but more moving parts to maintain."]},
  {t:"Qcells cell technology",tag:"v",b:["Q.ANTUM = Qcells' PERC cell (older, p-type).","Q.ANTUM NEO = Qcells' n-type TOPCon cell (newer).","The Q.TRON panel line uses NEO."],tip:"You do not need the physics. Know the names and that NEO is the newer one."},
  {t:"Output in real life",tag:"g",b:["Capacity factor: share of maximum output actually produced over a year. Solar is well below 100% (night, clouds). Roughly a quarter is common in the US; it varies.","Degradation: panels lose a little output each year.","Qcells states its Q.TRON panel keeps at least 90.58% of rated power at 25 years."]},
  {t:"What can go wrong",tag:"g",b:["Hail or wind damage. Tracker faults. Inverter faults. Wiring faults. Shading.","Late deliveries. Tariffs. Customs holds."],tip:"This is a Risk Lead's list. Every item can go in a risk register."}
 ],
 m4:[
  {t:"What a BESS does",tag:"g",b:["Stores energy when power is plentiful (often midday solar).","Sends it out when needed (often the evening peak).","Also helps keep the grid steady."]},

  {t:"BMS vs EMS vs SCADA",tag:"g",b:["BMS: protects the battery, cell by cell.","EMS: decides when to charge and discharge.","SCADA: lets people watch and command it all."],warn:"BMS in buildings means Building Management System. In a battery it means Battery Management System."},
  {t:"Support systems",tag:"g",b:["HVAC or liquid cooling keeps batteries in a safe temperature range.","Fire detection and suppression. Ventilation. Backup power for controls."],tip:"If cooling fails, risk goes up fast. Ask how it is monitored."},
  {t:"Chemistry and thermal runaway",tag:"g",b:["LFP = lithium iron phosphate. A common grid battery chemistry, generally more thermally stable than some others.","Thermal runaway: one cell overheats, heats its neighbors, and the heat spreads in a chain."]},
  {t:"AC-coupled vs DC-coupled",tag:"v",b:["AC-coupled: the battery has its own inverter and connects on the AC side. Easy to add to existing solar.","DC-coupled: the battery shares the solar inverter on the DC side.","Qcells' home battery, Q.HOME CORE G3, is AC-coupled and uses LFP."]},
  {t:"Safety standards",tag:"g",b:["UL 9540: standard for energy storage systems.","UL 9540A: a test for how fire spreads between cells.","NFPA 855: rules for installing stationary storage."],tip:"Know the names. Verify details before quoting them."},
  {t:"Numbers to know",tag:"g",b:["Duration: a 4-hour battery runs full power for 4 hours.","Round-trip efficiency: energy out divided by energy in. Always under 100%.","SOC = state of charge (fuel gauge). SOH = state of health (capacity left)."]}
 ],
 m5:[
  {t:"What SCADA is",tag:"g",b:["SCADA = Supervisory Control and Data Acquisition.","Software and hardware to watch and control equipment spread over a site.","Supervisory: people oversee. Data acquisition: collect readings."]},
  {t:"The layers",tag:"g",chain:["Sensors, meters, relays, inverters","Controllers: PLC and RTU","Network","SCADA server","HMI screens and historian"],b:["Data flows up. Commands flow down."]},
  {t:"Words you will hear",tag:"g",b:["Tag: one named data point, like Inverter 3 temperature.","Setpoint: a target value sent down.","Alarm: needs attention.","Historian: stores values over time.","HMI: the operator screen.","Trend: a graph over time."]},
  {t:"Device languages",tag:"g",b:["Devices talk using protocols, such as Modbus and DNP3. Substations often use IEC 61850.","Different vendors, different protocols: integration work, and risk."],tip:"Verify protocol details before quoting."},
  {t:"Plant controller and the grid",tag:"g",b:["PPC (Power Plant Controller) makes the whole plant behave: limit output, hold voltage, follow grid commands.","Curtailment: the grid operator asks the plant to cut output."]},
  {t:"If you know building automation",tag:"g",b:["Building automation has devices, controllers, front-end graphics, alarms, and trends.","SCADA is the same pattern."],tip:"Same architecture, different vocabulary."},
  {t:"What can go wrong",tag:"g",b:["Lost communications: operators lose sight or control.","Tag mapping errors found late. Alarm floods. Clocks not synced. Firmware mismatches.","Careless remote access. No tested safe state when comms drop. Gaps between vendors."],tip:"Each of these is a ready-made risk register entry."}
 ],
 m6:[
  {t:"IT vs OT",tag:"g",b:["IT = Information Technology: data, email, business systems. Protect secrecy.","OT = Operational Technology: runs physical equipment. Protect safety and uptime.","SCADA is OT."]},
  {t:"Convergence",tag:"g",b:["Connecting IT and OT gives useful data and dashboards.","It also opens a path for attackers toward physical equipment."],tip:"People who understand both sides are valuable."},
  {t:"Why OT is different",tag:"g",b:["You cannot just reboot a running plant.","Devices last 15 to 30 years. Vendors control updates. Patching needs outage windows."]},
  {t:"Basic defenses",tag:"g",b:["Segmentation: separate networks so trouble does not spread.","A firewall or DMZ between IT and OT. Least privilege. Controlled remote access.","Logging, backups, a tested incident plan.","Standards to know by name: IEC 62443 and NERC CIP. Verify where they apply."]},
  {t:"OTA is different",tag:"v",b:["OTA = Over-the-Air update: software or firmware pushed to a device remotely.","OTA is NOT the same as OT.","Example: Qcells' Q.HOME CORE G3 gets automatic OTA updates."],warn:"OT and OTA look alike. OT = the systems. OTA = how an update arrives."},
  {t:"OTA risks and controls",tag:"g",b:["Risk: a bad update breaks many devices at once. A fake update gets installed. No way to roll back.","Controls: sign updates, test first, roll out in stages, keep a rollback, require approvals."]},
  {t:"Say it simply",tag:"g",b:["OT first priority is safety and uptime. IT first priority is protecting data.","A good risk person helps both sides speak the same language."]}
 ],
 m7:[
  {t:"Project phases",tag:"g",chain:["Develop: site, permits, grid application","Design (engineering)","Procure: buy equipment","Construct","Commission: test","COD: start selling power","Operate (O&M)"]},
  {t:"Contract words",tag:"g",b:["NTP: written go-ahead to start. LNTP: go-ahead for limited early work.","PPA: contract to buy the power.","Change order: formal change to scope, price, or schedule.","Punch list: small leftover items. Substantial completion: usable, minor items left."]},
  {t:"Money and time words",tag:"g",b:["Contingency: money or time set aside for expected unknowns.","EAC: forecast of final cost. ETC: forecast of cost still to spend.","Critical path: the chain of tasks that sets the finish date. Float: slack time.","LDs: liquidated damages, a penalty set in advance for delay or underperformance."]},
  {t:"Connecting to the grid",tag:"g",b:["Interconnection: applications, studies, upgrades, agreements, then the physical connection at the POI.","Interconnection queue: the waiting line. A delay here delays everything.","ERCOT runs most of Texas. CAISO runs most of California (Atlas V and VI supply CAISO)."]},
  {t:"Buying equipment",tag:"g",b:["RFQ: ask for a price. RFI: ask a clarifying question.","Long-lead items (transformers, switchgear, batteries) can take many months. A classic schedule risk."]},
  {t:"Commissioning",tag:"g",b:["Steps: mechanical completion, energize, functional tests, performance tests, then COD.","Problems found late cost the most."]},
  {t:"Warranties",tag:"v",b:["Equipment warranty: the maker fixes the product.","Workmanship warranty: the builder fixes the install.","Performance warranty: a promised output level.","Qcells EPC job listings describe warranty work across solar, BESS, and balance-of-plant."]}
 ],
 m8:[
  {t:"Risk vs issue",tag:"g",b:["Risk: something that might happen and hurt cost, schedule, safety, or quality.","Issue: it already happened."]},
  {t:"Three kinds named in the job",tag:"g",b:["Execution: can we build it on plan?","Cost: will the money hold?","Technical: will the design and equipment work?"],tip:"The posting reportedly leads with these three. Confirm against the posting."},
  {t:"One risk register row",tag:"g",chain:["Risk (one clear sentence)","Trigger (the early sign)","Impact (cost, time, safety)","Likelihood and score","Owner (one person)","Mitigation (the action)","Evidence it is working","Status and escalation"]},
  {t:"Score and responses",tag:"g",b:["Score = likelihood x impact (each 1 to 5).","Four responses: avoid, reduce, transfer (contract or insurance), accept.","Residual risk: what is left after the action."]},
  {t:"Evidence over assurance",tag:"g",b:["Ask: is the mitigation really reducing risk, or is someone just saying it is?","Leading indicator: an early sign, like a supplier shipment slipping. Lagging indicator: a result, like final cost."]},
  {t:"Worked example: customs hold",tag:"g",b:["Risk: imported cells are detained at the port.","Trigger: a customs detention notice.","Impact: factory slows, projects slip.","Mitigation ideas: supplier paperwork and traceability, buffer stock, a second supplier, making more in-house.","Residual: lower, not zero."],tip:"The event is real (checked). The mitigation list is an example of how to think."},
  {t:"When the team disagrees",tag:"g",b:["Ask for the evidence and the assumptions.","Write the disagreement down.","If it stays open, escalate with facts, not opinions."]},
  {t:"Use your own experience",tag:"g",b:["Running any live operation means managing failure modes. That is risk work.","Describe your real examples with the same method: risk, trigger, impact, action, result."],tip:"Do not invent experience you do not have."}
 ],
 d1:[
  {t:"Three-phase in plain words",tag:"g",b:["Large power systems use three AC waves, offset in time, on three wires.","The result is smoother power, and big equipment runs better on it.","The grid, big transformers, and utility inverters are three-phase. Home outlets are usually single-phase."],tip:"If a nameplate says 3-phase, it is grid-scale equipment."},
  {t:"Low, medium, and high voltage",tag:"v",b:["Low voltage (under 1 kV): near the panels and inverters.","Medium voltage (about 1 to 35 kV): the collection lines inside the plant. 34.5 kV is common.","High voltage (above that, such as 115 to 345 kV): transmission lines.","kV = kilovolt = 1,000 volts."],tip:"Typical values. Each project differs."},
  {t:"The voltage staircase",tag:"v",chain:["Panels and inverters: low voltage","Pad-mount transformers: step up to about 34.5 kV","Collection lines carry 34.5 kV across the field","Collector substation: steps up to transmission voltage","POI and the grid"],b:["Example: one 300 MW plant steps 34.5 kV up to 345 kV for interconnection."]},
  {t:"Why higher voltage?",tag:"g",b:["Power = voltage x current.","The same power at higher voltage needs less current.","Less current means less heat loss and thinner wire."],tip:"Callback: this is the V x I from the electricity lesson."},
  {t:"Why a Risk Lead cares",tag:"v",b:["The main step-up transformer is custom. One engineering case study cites a 62-week lead time.","One vendor estimates substations can be roughly 5 to 10 percent of a solar plant's cost.","A late transformer or substation delays the whole project."],tip:"Lead times vary. Ask for the current supplier quote."}
 ],
 d2:[
  {t:"What protection does",tag:"g",b:["Protection stops damage and danger when something goes wrong.","Three steps: detect the problem, decide, interrupt the current."]},
  {t:"Fuse, breaker, relay",tag:"g",b:["Fuse: melts once, then must be replaced.","Breaker: a switch that can open under fault current and be reset.","Relay: the brain that senses trouble and tells a breaker to open.","Switchgear holds breakers and relays."]},
  {t:"What is a fault?",tag:"g",b:["A fault is an unwanted path for current, such as a short circuit.","Faults send huge current. Protection must clear them fast."]},
  {t:"Grounding",tag:"g",b:["Grounding connects equipment to the earth for safety and as a reference.","Poor grounding can mean shock risk and equipment damage.","A ground fault is current going to ground where it should not."]},
  {t:"Arc flash and lockout/tagout",tag:"g",b:["An arc flash is a violent burst of energy from an electrical fault.","Lockout/tagout keeps equipment de-energized while people work on it.","Labels, protective gear, and procedures exist because of these hazards."]},
  {t:"Why a Risk Lead cares",tag:"g",b:["Protection settings that are wrong or untested are found late, at commissioning.","Settings must match the grid operator's requirements.","Ask for test reports as evidence, not just a promise."]}
 ],
 d3:[
  {t:"What it is",tag:"g",b:["A one-line (single-line) diagram draws a three-phase system as one line per connection.","It is the electrical map of the plant."]},
  {t:"Symbols you will see",tag:"g",b:["Transformer: two linked circles.","Breaker: a small box on a line.","Bus: a thick bar where circuits join.","Feeder: a line leaving the bus to equipment.","Ground: three shrinking lines."],tip:"Drawing styles vary. Always check the legend."},
  {t:"Read it left to right",tag:"g",b:["Start at the generation (panels, inverters) and follow the line to the POI.","At each box ask: what is it, what protects it, who owns it?"]},
  {t:"The ownership line",tag:"g",b:["The diagram shows where the plant ends and the utility begins, usually near the POI.","The meter location matters for billing and responsibility.","Check the interconnection agreement for the exact line."]},
  {t:"Why a Risk Lead cares",tag:"g",b:["Drawings go stale. A mismatch between diagram and field is a risk.","As-built drawings show what was actually built.","Design changes should update the diagram, with a record."]}
 ],
 d4:[
  {t:"The 60 Hz heartbeat",tag:"v",b:["The North American grid runs at 60 Hz (cycles per second).","Even small deviations matter. They can trigger protection systems and cause outages.","Frequency stays near 60 only when supply and demand stay balanced."]},
  {t:"Inertia",tag:"v",b:["Spinning generators (gas, coal, nuclear, hydro) store motion energy.","That inertia resists sudden frequency changes and buys time.","Solar and batteries connect through inverters and do not provide inertia on their own."]},
  {t:"Inverter-based resources (IBRs)",tag:"v",b:["Solar, wind, and batteries connect through power electronics.","They behave differently from spinning generators. That does not make them bad for reliability.","If equipped and coordinated, they can supply fast frequency response."]},
  {t:"Grid-following vs grid-forming",tag:"v",b:["Grid-following inverters sync to the grid signal that already exists.","Grid-forming inverters can help create that signal and limit frequency swings.","Grid-forming is newer. Grid operators, including ERCOT, are working on specifications."]},
  {t:"Ride-through",tag:"v",b:["Plants must stay online through certain voltage and frequency dips. NERC's PRC-024 sets ride-through requirements.","NERC and WECC found solar plants dropping offline during disturbances because of inverter settings."],tip:"Settings errors are a real risk, not a theory."},
  {t:"Reactive power",tag:"g",b:["Reactive power helps support voltage.","Grid rules often require plants to supply it within a set range, such as a power factor range.","The range is set by the grid operator. Check the local rule."]},
  {t:"Why a Risk Lead cares",tag:"g",b:["Failing grid-code tests can delay COD.","Settings that do not match the studies cause trips and penalties.","Rule changes (like grid-forming specs) can change requirements mid-project."]}
 ],
 e1:[
  {t:"STAR in four words",tag:"g",b:["Situation: the setting. Task: your job in it.","Action: what you did. Result: what happened.","Tell it as a short story. End with a result, ideally a number."]},
  {t:"Tell me about yourself",tag:"g",b:["Three parts: where you are now, how you got here, why this role.","Keep it to 60 to 90 seconds."]},
  {t:"When you do not know a term",tag:"g",b:["Say what you do know, connect it to something you have used, and ask how they use it.","Example: I have not used that term. The closest thing I know is ___. How do you use it here?"]},
  {t:"Use your own examples",tag:"g",b:["Prepare three real stories: you challenged an assumption, a team disagreed with you, you prevented a failure.","The Cheat sheet has boxes to save them."]},
  {t:"Questions to ask them",tag:"g",b:["What are your top three risks right now?","How are risks tracked and reviewed?","What does success look like in 90 days?"]},
  {t:"What not to do",tag:"g",b:["Do not invent experience.","Do not blame past employers.","Do not guess a number. Say you would verify it."]}
 ]
},
questions:[
 {id:"q001",m:"m0",q:"Who designs, buys equipment for, and builds a power plant?",a:["The EPC contractor","The utility customer","The grid inspector","The panel recycler"],why:"EPC = Engineering, Procurement, Construction.",l:1},
 {id:"q002",m:"m0",q:"Who runs the shared network of power lines?",a:["The utility or grid operator","The developer","The EPC contractor","The panel maker"],why:"Plants connect to the grid. They do not run it.",l:1},
 {id:"q003",m:"m0",q:"What does a developer do?",a:["Finds the site and gets permits and grid permission","Installs the panels","Runs the plant every day","Makes the batteries"],why:"Developers start the project before design and construction.",l:1},
 {id:"q004",m:"m0",q:"What does a Risk Lead ask along the whole path?",a:["What could go wrong, and who owns the fix?","How cheap are the panels?","What color is the fence?","Who designed the logo?"],why:"Spot, rate, assign an owner, track the fix.",l:2},
 {id:"q005",m:"m0",q:"A \"load\" is:",a:["Anything that uses electricity","A type of battery","A type of transformer","A solar panel"],why:"Homes and businesses are the load on the grid.",l:0},
 {id:"q101",m:"m1",q:"What does Qcells' EPC business do?",a:["Designs, buys equipment for, and builds power plants","Only sells rooftop panels","Only runs the power grid","Only makes phone batteries"],why:"EPC = Engineering, Procurement, Construction.",l:1},
 {id:"q102",m:"m1",q:"Where is Qcells USA headquartered?",a:["Houston, Texas","Atlanta, Georgia","Phoenix, Arizona","Austin, Texas"],why:"Qcells USA is Houston-based. Georgia is where the factories are.",l:0},
 {id:"q103",m:"m1",q:"Where are Qcells' big US factories?",a:["Georgia: Dalton and Cartersville","Arizona","Texas","Nevada"],why:"Arizona is where the Atlas V and VI projects were built.",l:2},
 {id:"q104",m:"m1",q:"What slowed Qcells' Georgia factories in 2025?",a:["Customs held up imported solar cells","A hurricane","A worker strike","A factory fire"],why:"CBP detained cells under UFLPA. 1,000 workers were furloughed in Nov 2025. Normal production returned in March 2026.",l:4},
 {id:"q105",m:"m1",q:"Atlas V and VI in Arizona total about:",a:["372 MWdc","37 MWdc","3,720 MWdc","12 MWdc"],why:"237 + 135 = 372 MWdc. One buyer announcement says about 357 MWdc, so numbers differ by source.",l:3},
 {id:"q106",m:"m1",q:"What does a Risk Lead mainly do?",a:["Finds what could go wrong, rates it, and tracks fixes","Installs rooftop panels","Sells panels to customers","Writes patents"],why:"Spot, rate, assign an owner, track the mitigation.",l:6},
 {id:"q107",m:"m1",q:"The customs hold is a good example of:",a:["A single point of dependency","A design error","A tax credit","A weather event"],why:"One supply link stopped and output slowed.",l:5},
 {id:"q201",m:"m2",q:"A battery is 100 MW and 400 MWh. What does 400 MWh tell you?",a:["How much energy it can store","How fast it can charge","Its voltage","Its weight"],why:"MWh is energy (how much). MW is power (how fast).",l:2},
 {id:"q202",m:"m2",q:"100 MW for 4 hours equals:",a:["400 MWh","25 MWh","104 MWh","100 MWh"],why:"Power x time = energy. 100 x 4 = 400.",l:2},
 {id:"q203",m:"m2",q:"Which source produces DC power?",a:["A solar panel","The utility grid","A wall outlet","A transmission line"],why:"Panels and batteries are DC. The grid is AC.",l:3},
 {id:"q204",m:"m2",q:"MWac is:",a:["What the inverters can send to the grid","The panel rating in full sun","The battery size","The battery voltage"],why:"MWdc = panels. MWac = after the inverters. Ask which one a number means.",l:4},
 {id:"q205",m:"m2",q:"Voltage is most like:",a:["Water pressure","Water used per hour","Pipe length","Tank size"],why:"Voltage is the push. Current is the flow.",l:0},
 {id:"q206",m:"m2",q:"1 GW equals:",a:["1,000 MW","100 MW","10,000 MW","1,000,000 MW"],why:"kW, MW, GW each step up by 1,000.",l:1},
 {id:"q301",m:"m3",q:"Which order is correct for a solar plant?",a:["Panels, inverter, transformer, grid","Grid, inverter, panels, transformer","Inverter, panels, grid, transformer","Panels, grid, inverter, transformer"],why:"DC panels feed the inverter, then AC goes through the transformer to the grid.",l:0},
 {id:"q302",m:"m3",q:"What does an inverter do?",a:["Changes DC to AC","Stores energy","Cools the panels","Measures sunlight"],why:"Panels make DC. The grid uses AC.",l:2},
 {id:"q303",m:"m3",q:"Which Qcells name is the n-type TOPCon cell?",a:["Q.ANTUM NEO","Q.ANTUM","Q.HOME CORE","Q.OMMAND"],why:"Q.ANTUM is PERC. Q.ANTUM NEO is the newer n-type TOPCon. Q.HOME CORE is a battery. Q.OMMAND is an app.",l:4},
 {id:"q304",m:"m3",q:"A tracker does what?",a:["Tilts panels to follow the sun","Finds lost panels","Measures voltage","Stores power"],why:"More energy, but more moving parts to maintain.",l:3},
 {id:"q305",m:"m3",q:"Degradation means:",a:["Panels slowly lose output over the years","Panels break all at once","Panels get cheaper","Panels turn into AC"],why:"Warranties guarantee a minimum output after many years.",l:5},
 {id:"q306",m:"m3",q:"Capacity factor is:",a:["Share of maximum output actually produced over time","Number of panels","Panel size","Inverter price"],why:"Solar is well below 100% because of night and clouds.",l:5},
 {id:"q307",m:"m3",q:"A string is:",a:["Several panels wired in a row","A battery","A cable to the grid","A type of inverter"],why:"Strings feed combiner boxes, which feed inverters.",l:1},
 {id:"q401",m:"m4",q:"What does the BMS watch in a battery?",a:["Cell voltage and temperature","Grid prices","Panel angle","Building lights"],why:"Battery Management System. In buildings, BMS means Building Management System.",l:2},
 {id:"q402",m:"m4",q:"What does the PCS do?",a:["Converts DC to AC and AC to DC","Stores energy","Fights fires","Sells power"],why:"Power Conversion System.",l:1},
 {id:"q403",m:"m4",q:"Which order is correct for a BESS?",a:["Racks, PCS, transformer, switchgear, POI, grid","Grid, POI, racks, PCS","Racks, grid, PCS, transformer","Transformer, racks, PCS, grid"],why:"DC batteries, convert to AC, raise voltage, protect, connect.",l:1},
 {id:"q404",m:"m4",q:"AC-coupled battery means:",a:["It has its own inverter on the AC side","It shares the solar DC bus","It has no inverter","It needs no BMS"],why:"DC-coupled shares the solar inverter. Qcells Q.HOME CORE G3 is AC-coupled.",l:5},
 {id:"q405",m:"m4",q:"Thermal runaway is:",a:["A cell overheating and heating its neighbors in a chain","Fast charging","A cooling mode","A software update"],why:"This is why cooling, spacing, and fire design matter.",l:4},
 {id:"q406",m:"m4",q:"Which system decides when to charge or discharge?",a:["EMS","BMS","HVAC","POI"],why:"Energy Management System. EMS also means Emergency Medical Services elsewhere.",l:2},
 {id:"q407",m:"m4",q:"Round-trip efficiency is below 100% because:",a:["Some energy is lost as heat when charging and discharging","Batteries leak electrons","The grid keeps some","Sunlight is lost"],why:"Energy out divided by energy in is always under 100%.",l:7},
 {id:"q408",m:"m4",q:"Which standard tests how fire spreads between battery cells?",a:["UL 9540A","NFPA 70","IEEE 802","ISO 9001"],why:"UL 9540A is the test method. Verify details before quoting.",l:6},
 {id:"q501",m:"m5",q:"What does SCADA let operators do?",a:["Watch and control equipment remotely","Design panels","Pay invoices","Write contracts"],why:"Supervisory Control and Data Acquisition.",l:0},
 {id:"q502",m:"m5",q:"Where is SCADA data stored over time?",a:["A historian","A breaker","A transformer","A tracker"],why:"The historian keeps readings for trends and investigations.",l:2},
 {id:"q503",m:"m5",q:"Devices in SCADA talk to each other using:",a:["Protocols such as Modbus or DNP3","Only email","Only paper logs","Radio stations"],why:"Different vendors and protocols mean integration risk.",l:3},
 {id:"q504",m:"m5",q:"A setpoint is:",a:["A target value sent to equipment","An alarm","A broken sensor","A report"],why:"Example: tell the plant to limit output to 80 MW.",l:2},
 {id:"q505",m:"m5",q:"The grid operator asks a plant to cut output. This is:",a:["Curtailment","Degradation","Commissioning","A change order"],why:"The PPC carries out the request.",l:4},
 {id:"q506",m:"m5",q:"What does the Power Plant Controller do?",a:["Makes the whole plant follow grid rules","Cleans panels","Tracks money","Cools batteries"],why:"Limits output, holds voltage, follows commands.",l:4},
 {id:"q507",m:"m5",q:"Why is losing communications a risk?",a:["Operators may lose visibility or control","Panels stop existing","Batteries get cheaper","Nothing changes"],why:"Plants need a tested safe state for loss of comms.",l:6},
 {id:"q508",m:"m5",q:"Building automation and SCADA are alike because both:",a:["Monitor and control equipment using sensors, controllers, and screens","Sell power","Are batteries","Are contracts"],why:"Same architecture, different vocabulary.",l:5},
 {id:"q601",m:"m6",q:"OT means:",a:["Technology that controls physical equipment","Office email","Over-the-air updates","Ordering tools"],why:"Operational Technology.",l:0},
 {id:"q602",m:"m6",q:"OTA means:",a:["Over-the-air: software pushed remotely","Operational Technology Access","Outdoor temperature alarm","On-time arrival"],why:"Not the same as OT.",l:4},
 {id:"q603",m:"m6",q:"The top priority in OT is usually:",a:["Safety and uptime","Email speed","Marketing","A pretty screen"],why:"IT usually puts protecting data first.",l:0},
 {id:"q604",m:"m6",q:"Why is patching OT hard?",a:["Rebooting can stop a running plant","OT has no software","Patches are free","OT is always offline"],why:"Patching needs planned outage windows.",l:2},
 {id:"q605",m:"m6",q:"A DMZ between IT and OT is:",a:["A buffer network zone with tightly controlled traffic","A battery type","A grid rule","A solar cell"],why:"It limits what can cross between the two worlds.",l:3},
 {id:"q606",m:"m6",q:"The biggest OTA risk is:",a:["A bad update could break many devices at once","Updates are always free","OTA only works on panels","There is no risk"],why:"Controls: signed updates, testing, staged rollout, rollback.",l:5},
 {id:"q607",m:"m6",q:"Which Qcells product gets OTA firmware updates?",a:["Q.HOME CORE G3","A bare solar panel","A steel racking frame","A cable"],why:"Checked on Qcells' product page.",l:4},
 {id:"q608",m:"m6",q:"Network segmentation means:",a:["Splitting networks so a problem does not spread","Cutting panels","Splitting a contract","Dividing a battery"],why:"A basic OT security control.",l:3},
 {id:"q701",m:"m7",q:"Interconnection means:",a:["Permission and physical connection to the grid","A type of panel","A loan","Insurance"],why:"Studies, upgrades, agreements, then the physical tie-in at the POI.",l:3},
 {id:"q702",m:"m7",q:"A PPA is:",a:["A contract to buy power on agreed terms","A panel part","A fire permit","A paint spec"],why:"Atlas V and VI sell power under long-term contracts to Southern California Edison.",l:1},
 {id:"q703",m:"m7",q:"LNTP lets a contractor:",a:["Start limited early work before the full go-ahead","Finish the project","End the contract","Test a battery"],why:"Limited Notice to Proceed.",l:1},
 {id:"q704",m:"m7",q:"A change order is:",a:["A formal change to scope, price, or schedule","A broken part","An alarm","A test"],why:"Track these closely. They are cost and schedule risk.",l:1},
 {id:"q705",m:"m7",q:"Contingency is:",a:["Money or time set aside for expected unknowns","A penalty","A bonus","A permit"],why:"A Risk Lead asks if it is enough.",l:2},
 {id:"q706",m:"m7",q:"Liquidated damages are:",a:["A penalty agreed in advance for delay or underperformance","A bonus","A tax","A loan"],why:"Often shortened to LDs.",l:2},
 {id:"q707",m:"m7",q:"Commissioning is:",a:["Testing that everything works before handover","Buying equipment","Designing the plant","Marketing"],why:"Problems found late cost the most.",l:5},
 {id:"q708",m:"m7",q:"An RFI is:",a:["A question sent to clarify design or requirements","A loan","A refund","A repair form"],why:"Request for Information.",l:4},
 {id:"q709",m:"m7",q:"Which order of phases is correct?",a:["Develop, design, buy, build, test, run","Run, buy, test, design","Buy, run, develop, test","Test, build, design, run"],why:"Then COD is the day it starts selling power.",l:0},
 {id:"q801",m:"m8",q:"A risk is:",a:["Something that might happen and hurt cost, schedule, safety, or quality","Something that already happened","A finished task","A contract"],why:"If it already happened, it is an issue.",l:0},
 {id:"q802",m:"m8",q:"An issue is:",a:["A problem that has already happened","A maybe","A budget","A schedule"],why:"Risks are maybes. Issues are now.",l:0},
 {id:"q803",m:"m8",q:"A risk score is usually:",a:["Likelihood x impact","Cost + time","Owner x status","Panels x batteries"],why:"Each rated 1 to 5.",l:3},
 {id:"q804",m:"m8",q:"The four standard risk responses are:",a:["Avoid, reduce, transfer, accept","Ignore, hide, blame, delay","Buy, sell, hold, rent","Design, build, test, run"],why:"Pick one and write it down.",l:3},
 {id:"q805",m:"m8",q:"Residual risk is:",a:["Risk left after mitigation","Risk before mitigation","Total cost","The risk owner"],why:"It should be lower, not assumed zero.",l:3},
 {id:"q806",m:"m8",q:"Imported cells are detained at the port. Best category?",a:["Supply chain and schedule risk","Roof leak","Paint","Payroll"],why:"This really happened to Qcells in 2025.",l:5},
 {id:"q807",m:"m8",q:"A good risk entry always has:",a:["An owner and a mitigation","Only a title","A joke","No date"],why:"No owner means nobody acts.",l:2},
 {id:"q808",m:"m8",q:"The team disagrees with your risk rating. Best first move?",a:["Ask for the evidence and compare assumptions","Give in","Ignore them","Escalate without talking first"],why:"Facts first. Write the disagreement down.",l:6},
 {id:"q809",m:"m8",q:"Which is a leading indicator?",a:["A supplier shipment slipping before the install date","The final cost","The finished project","A lawsuit result"],why:"Leading means early warning.",l:4},
 {id:"qd101",m:"d1",q:"Large power systems use:",a:["Three-phase AC","Single-wire DC only","Batteries only","Wireless power"],why:"Three AC waves offset in time on three wires.",l:0},
 {id:"qd102",m:"d1",q:"Which is medium voltage?",a:["About 34.5 kV collection lines","A 9-volt battery","A 345 kV transmission line","A phone charger"],why:"Medium voltage is about 1 to 35 kV.",l:1},
 {id:"qd103",m:"d1",q:"Why raise the voltage for long distances?",a:["Less current, so less heat loss","More current","Cheaper panels","Brighter sun"],why:"Power = voltage x current. Higher voltage means lower current for the same power.",l:3},
 {id:"qd104",m:"d1",q:"In the 300 MW example, the plant steps 34.5 kV up to:",a:["345 kV","3.45 kV","34.5 V","1,500 V"],why:"The collector substation steps up to transmission voltage.",l:2},
 {id:"qd105",m:"d1",q:"Why can the main step-up transformer be a schedule risk?",a:["It is custom and can take a long time to deliver","It is free","It is always in stock","It is tiny"],why:"One case study cites 62 weeks. Lead times vary.",l:4},
 {id:"qd201",m:"d2",q:"What does a relay do?",a:["Senses trouble and tells a breaker to open","Stores energy","Makes power","Cools the plant"],why:"The relay is the brain. The breaker is the switch.",l:1},
 {id:"qd202",m:"d2",q:"A breaker differs from a fuse because it:",a:["Can be reset after tripping","Melts once","Is never used","Makes DC"],why:"A fuse must be replaced after it melts.",l:1},
 {id:"qd203",m:"d2",q:"A fault is:",a:["An unwanted path for current, like a short circuit","A planned outage","A type of panel","A report"],why:"Faults send huge current. Protection must clear them fast.",l:2},
 {id:"qd204",m:"d2",q:"Grounding is mainly for:",a:["Safety and a reference to earth","Charging batteries","Making AC","Cooling"],why:"Poor grounding means shock risk and equipment damage.",l:3},
 {id:"qd205",m:"d2",q:"Lockout/tagout is used to:",a:["Keep equipment de-energized while people work","Order parts","Log alarms","Test panels"],why:"It protects workers from unexpected energy.",l:4},
 {id:"qd206",m:"d2",q:"A protection problem found late, at commissioning, is usually:",a:["Costly, because fixes come at the end","Free","Impossible","Good news"],why:"Ask for test reports early as evidence.",l:5},
 {id:"qd301",m:"d3",q:"A one-line diagram shows:",a:["The electrical system as a simple map","The paint colors","The staff schedule","The weather"],why:"One line stands for a whole three-phase connection.",l:0},
 {id:"qd302",m:"d3",q:"A bus on a one-line diagram is:",a:["A thick bar where circuits join","A vehicle","A battery","A sensor"],why:"Feeders leave the bus to equipment.",l:1},
 {id:"qd303",m:"d3",q:"The plant's responsibility usually ends near:",a:["The point of interconnection","The panels","The fence","The control room"],why:"Check the interconnection agreement for the exact line.",l:3},
 {id:"qd304",m:"d3",q:"As-built drawings show:",a:["What was actually built","The first idea","The budget","The warranty"],why:"Drawings go stale. As-builts record the real thing.",l:4},
 {id:"qd401",m:"d4",q:"North American grid frequency is:",a:["60 Hz","50 Hz","6 Hz","600 Hz"],why:"Small deviations can trigger protection and outages.",l:0},
 {id:"qd402",m:"d4",q:"Grid inertia comes mainly from:",a:["Spinning generators","Solar panels","Batteries alone","Inverters alone"],why:"Spinning mass resists frequency change.",l:1},
 {id:"qd403",m:"d4",q:"Solar and batteries connect to the grid through:",a:["Inverters (power electronics)","Spinning turbines","Steam","Gears"],why:"That is why they are called inverter-based resources.",l:2},
 {id:"qd404",m:"d4",q:"A grid-forming inverter can:",a:["Help set the grid signal and limit frequency swings","Only follow the grid","Make no power","Replace the grid"],why:"Grid-following inverters sync to a signal that already exists.",l:3},
 {id:"qd405",m:"d4",q:"Ride-through means a plant:",a:["Stays online through certain voltage or frequency dips","Shuts off at any dip","Runs only at night","Skips testing"],why:"Inverter settings that trip too easily caused solar losses in disturbances.",l:4},
 {id:"qd406",m:"d4",q:"Reactive power helps with:",a:["Voltage support","Panel cleaning","Billing","Tracking"],why:"The required range is set by the grid operator.",l:5},
 {id:"qe101",m:"e1",q:"In STAR, what does the R stand for?",a:["Result","Risk","Review","Rating"],why:"Situation, Task, Action, Result.",l:0},
 {id:"qe102",m:"e1",q:"A good STAR story ends with:",a:["A clear result, ideally with a number","A joke","An apology","A question"],why:"The result is what the listener remembers.",l:0},
 {id:"qe103",m:"e1",q:"If you do not know a term, a good move is to:",a:["Say what you know, connect it to something you have used, and ask","Guess confidently","Change the subject","Stay silent"],why:"Honesty plus curiosity beats a bluff.",l:2},
 {id:"qe104",m:"e1",q:"The best examples to use in an interview are:",a:["Your own real experiences","Invented solar projects","Someone else's story","Copied answers"],why:"Real examples hold up under follow-up questions.",l:3}

glossary:[
 {k:"Grid",full:"The grid",plain:"The shared network of power lines that moves electricity.",m:"m0"},
 {k:"Utility",full:"Utility",plain:"A company that delivers electricity and runs part of the grid.",m:"m0"},
 {k:"Load",full:"Load",plain:"Anything that uses electricity, such as homes and businesses.",m:"m0"},
 {k:"Developer",full:"Developer",plain:"The company that finds the site and gets permits and grid permission.",m:"m0"},
 {k:"Operator",full:"Operator",plain:"The team that runs and repairs a plant after it is built.",m:"m0"},
 {k:"EPC",full:"Engineering, Procurement, Construction",plain:"Design it, buy the equipment, build it.",m:"m1",q:1,top:1,grp:"project"},
 {k:"Vertical integration",full:"Vertical integration",plain:"One company makes every step itself, here from ingot to finished panel.",m:"m1"},
 {k:"Ingot",full:"Ingot",plain:"A block of purified silicon, the first step in making cells.",m:"m1"},
 {k:"Wafer",full:"Wafer",plain:"A thin slice cut from an ingot. It becomes a solar cell.",m:"m1"},
 {k:"UFLPA",full:"Uyghur Forced Labor Prevention Act",plain:"US law that lets customs detain goods tied to forced labor in Xinjiang, China.",m:"m1",q:1,grp:"risk"},
 {k:"CBP",full:"Customs and Border Protection",plain:"US agency that checks imports at the border.",m:"m1",q:1,grp:"risk"},
 {k:"Furlough",full:"Furlough",plain:"A temporary leave from work. Workers are sent home, not fired.",m:"m1"},
 {k:"MW",full:"Megawatt",plain:"Power: how fast energy flows. 1 MW = 1,000 kW.",m:"m2",q:1,top:1,grp:"power"},
 {k:"MWh",full:"Megawatt-hour",plain:"Energy: how much. 100 MW for 4 hours = 400 MWh.",m:"m2",q:1,top:1,grp:"power"},
 {k:"GW",full:"Gigawatt",plain:"1,000 MW.",m:"m2",q:1,grp:"power"},
 {k:"DC",full:"Direct Current",plain:"Flows one way. Panels and batteries.",m:"m2",q:1,grp:"power"},
 {k:"AC",full:"Alternating Current",plain:"Flips direction. The grid and outlets.",m:"m2",q:1,grp:"power"},
 {k:"MWdc / MWac",full:"Megawatts DC / Megawatts AC",plain:"DC = panel rating. AC = what inverters send to the grid. Ask which one.",m:"m2"},
 {k:"PV",full:"Photovoltaic",plain:"Turns sunlight directly into electricity.",m:"m3",q:1,top:1,grp:"solar"},
 {k:"Module (panel)",full:"Module (panel)",plain:"Many solar cells in one frame.",m:"m3"},
 {k:"Inverter",full:"Inverter",plain:"Changes DC to AC.",m:"m3"},
 {k:"String",full:"String",plain:"Panels wired in a row.",m:"m3"},
 {k:"Tracker",full:"Tracker",plain:"Motor that tilts panels to follow the sun.",m:"m3"},
 {k:"Capacity factor",full:"Capacity factor",plain:"Share of maximum output actually produced over time.",m:"m3"},
 {k:"Racking",full:"Racking",plain:"Steel frame that holds panels.",m:"m3"},
 {k:"Degradation",full:"Degradation",plain:"Slow yearly loss of panel or battery output.",m:"m3"},
 {k:"Combiner box",full:"Combiner box",plain:"Joins several strings into one cable toward the inverter.",m:"m3"},
 {k:"TOPCon",full:"Tunnel Oxide Passivated Contact",plain:"Newer n-type solar cell design. Qcells' version is Q.ANTUM NEO.",m:"m3",q:1,grp:"solar"},
 {k:"PERC",full:"Passivated Emitter and Rear Cell",plain:"Older mainstream p-type cell design. Qcells' version is Q.ANTUM.",m:"m3",q:1,grp:"solar"},
 {k:"BESS",full:"Battery Energy Storage System",plain:"A large battery plant that stores power for later.",m:"m4",q:1,top:1,grp:"bess"},
 {k:"BMS",full:"Battery Management System",plain:"Watches every battery cell for voltage, temperature, and safety.",warn:"In facilities, BMS means Building Management System.",m:"m4",q:1,top:1,two:1,grp:"bess"},
 {k:"PCS",full:"Power Conversion System",plain:"Converts DC to AC and AC to DC for the battery.",warn:"Other industries use PCS for other things, such as process control system.",m:"m4",q:1,top:1,two:1,grp:"bess"},
 {k:"EMS",full:"Energy Management System",plain:"Software that decides when the battery charges and discharges.",warn:"Also means Emergency Medical Services.",m:"m4",q:1,top:1,two:1,grp:"bess"},
 {k:"LFP",full:"Lithium Iron Phosphate",plain:"A common battery chemistry for grid storage.",m:"m4",q:1,grp:"bess"},
 {k:"SOC",full:"State of Charge",plain:"The battery fuel gauge, in percent.",warn:"Also means Security Operations Center.",m:"m4",q:1,two:1,grp:"bess"},
 {k:"SOH",full:"State of Health",plain:"How much capacity the battery has left compared with new.",m:"m4",q:1,grp:"bess"},
 {k:"HVAC",full:"Heating, Ventilation, Air Conditioning",plain:"Keeps batteries and equipment in a safe temperature range.",m:"m4",q:1,grp:"bess"},
 {k:"Thermal runaway",full:"Thermal runaway",plain:"A battery cell overheats and the heat spreads cell to cell.",m:"m4"},
 {k:"Transformer",full:"Transformer",plain:"Raises or lowers voltage.",m:"m4"},
 {k:"Switchgear",full:"Switchgear",plain:"Breakers and protection equipment in one lineup.",m:"m4"},
 {k:"UL 9540 / 9540A",full:"UL 9540 / UL 9540A",plain:"Storage system standard and the fire-spread test. Verify before quoting.",m:"m4"},
 {k:"NFPA 855",full:"NFPA 855",plain:"Rules for installing stationary energy storage. Verify before quoting.",m:"m4"},
 {k:"SCADA",full:"Supervisory Control and Data Acquisition",plain:"Screens and controls to watch and run equipment from afar.",m:"m5",q:1,top:1,grp:"scada"},
 {k:"HMI",full:"Human-Machine Interface",plain:"The screen an operator uses.",m:"m5",q:1,grp:"scada"},
 {k:"PLC",full:"Programmable Logic Controller",plain:"A rugged small computer that runs equipment logic.",m:"m5",q:1,grp:"scada"},
 {k:"RTU",full:"Remote Terminal Unit",plain:"A field box that collects readings and passes commands to SCADA.",m:"m5",q:1,grp:"scada"},
 {k:"PPC",full:"Power Plant Controller",plain:"Makes the whole plant follow grid rules.",m:"m5",q:1,grp:"scada"},
 {k:"Historian",full:"Historian",plain:"Database of plant readings over time.",m:"m5"},
 {k:"Tag",full:"Tag",plain:"One named data point in SCADA.",m:"m5"},
 {k:"Setpoint",full:"Setpoint",plain:"A target value sent to equipment.",m:"m5"},
 {k:"Curtailment",full:"Curtailment",plain:"The grid asks the plant to cut output.",m:"m5"},
 {k:"Modbus / DNP3",full:"Modbus / DNP3",plain:"Common languages devices use to talk to SCADA. Verify details before quoting.",m:"m5"},
 {k:"IT",full:"Information Technology",plain:"Business computers, data, email, networks. Protects data first.",m:"m6",q:1,top:1,grp:"itot"},
 {k:"OT",full:"Operational Technology",plain:"Systems that run physical equipment. Safety and uptime come first.",warn:"Not the same as OTA.",m:"m6",q:1,top:1,two:1,grp:"itot"},
 {k:"OTA",full:"Over-the-Air (update)",plain:"Software or firmware sent to a device remotely.",warn:"Not the same as OT.",m:"m6",q:1,top:1,two:1,grp:"itot"},
 {k:"DMZ",full:"Demilitarized Zone",plain:"A buffer network between IT and OT with tightly controlled traffic.",m:"m6",q:1,grp:"itot"},
 {k:"Segmentation",full:"Segmentation",plain:"Splitting networks so a problem in one does not spread to others.",m:"m6"},
 {k:"NERC",full:"North American Electric Reliability Corporation",plain:"Sets reliability rules for the North American grid, including cyber rules (CIP).",m:"m6",q:1,grp:"grid"},
 {k:"POI",full:"Point of Interconnection",plain:"The exact spot where the plant connects to the grid.",m:"m7",q:1,top:1,grp:"grid"},
 {k:"COD",full:"Commercial Operation Date",plain:"The day the plant officially starts selling power.",m:"m7",q:1,top:1,grp:"project"},
 {k:"NTP",full:"Notice to Proceed",plain:"Written go-ahead to start work.",m:"m7",q:1,grp:"project"},
 {k:"LNTP",full:"Limited Notice to Proceed",plain:"Go-ahead for limited early work before the full contract is final.",m:"m7",q:1,grp:"project"},
 {k:"PPA",full:"Power Purchase Agreement",plain:"A contract where a buyer agrees to buy the power on set terms.",m:"m7",q:1,grp:"project"},
 {k:"RFI",full:"Request for Information",plain:"A question sent to clarify design or requirements.",m:"m7",q:1,grp:"project"},
 {k:"RFQ",full:"Request for Quote",plain:"Asking suppliers for a price.",m:"m7",q:1,grp:"project"},
 {k:"EAC",full:"Estimate at Completion",plain:"Forecast of the final total cost.",m:"m7",q:1,grp:"project"},
 {k:"ETC",full:"Estimate to Complete",plain:"Forecast of cost still to spend.",m:"m7",q:1,grp:"project"},
 {k:"LDs",full:"Liquidated Damages",plain:"A penalty agreed in advance for delay or underperformance.",m:"m7",q:1,grp:"project"},
 {k:"O&M",full:"Operations and Maintenance",plain:"Running and fixing the plant after it is built.",m:"m7",q:1,grp:"project"},
 {k:"ERCOT",full:"Electric Reliability Council of Texas",plain:"Runs most of the Texas grid.",m:"m7",q:1,grp:"grid"},
 {k:"CAISO",full:"California Independent System Operator",plain:"Runs most of California's grid.",m:"m7",q:1,grp:"grid"},
 {k:"Interconnection",full:"Interconnection",plain:"Permission and physical connection to the grid.",m:"m7"},
 {k:"Commissioning",full:"Commissioning",plain:"Testing everything works before handover.",m:"m7"},
 {k:"Contingency",full:"Contingency",plain:"Money or time set aside for expected unknowns.",m:"m7"},
 {k:"Change order",full:"Change order",plain:"Formal change to scope, price, or schedule.",m:"m7"},
 {k:"Critical path",full:"Critical path",plain:"The chain of tasks that sets the finish date.",m:"m7"},
 {k:"Punch list",full:"Punch list",plain:"Small leftover items before final completion.",m:"m7"},
 {k:"Risk register",full:"Risk register",plain:"The list of risks with owner, score, and action.",m:"m8"},
 {k:"Likelihood",full:"Likelihood",plain:"How probable the risk is, scored 1 to 5.",m:"m8"},
 {k:"Impact",full:"Impact",plain:"How bad it would be if it happens, scored 1 to 5.",m:"m8"},
 {k:"Mitigation",full:"Mitigation",plain:"The action that lowers a risk.",m:"m8"},
 {k:"Residual risk",full:"Residual risk",plain:"Risk left after the action.",m:"m8"},
 {k:"Leading indicator",full:"Leading indicator",plain:"An early warning sign, before the damage.",m:"m8"},
 {k:"Lagging indicator",full:"Lagging indicator",plain:"A result you see after the fact.",m:"m8"},
 {k:"Escalation",full:"Escalation",plain:"Raising a risk to a higher decision-maker.",m:"m8"},
 {k:"Three-phase",full:"Three-phase power",plain:"Three AC waves offset in time on three wires. Used for grid-scale power.",m:"d1"},
 {k:"kV",full:"Kilovolt",plain:"1,000 volts.",m:"d1"},
 {k:"Medium voltage",full:"Medium voltage",plain:"About 1 to 35 kV. Plant collection lines, often 34.5 kV.",m:"d1"},
 {k:"High voltage",full:"High voltage",plain:"Above medium voltage, such as 115 to 345 kV. Transmission lines.",m:"d1"},
 {k:"Collector substation",full:"Collector substation",plain:"Gathers the plant's power and steps it up for the grid.",m:"d1"},
 {k:"Fault",full:"Fault",plain:"An unwanted path for current, such as a short circuit.",m:"d2"},
 {k:"Breaker",full:"Circuit breaker",plain:"A resettable switch that can open under fault current.",m:"d2"},
 {k:"Relay",full:"Protective relay",plain:"Senses trouble and tells a breaker to open.",m:"d2"},
 {k:"Fuse",full:"Fuse",plain:"A part that melts once to stop dangerous current.",m:"d2"},
 {k:"Grounding",full:"Grounding",plain:"Connecting equipment to the earth for safety and a reference.",m:"d2"},
 {k:"Arc flash",full:"Arc flash",plain:"A violent burst of energy from an electrical fault.",m:"d2"},
 {k:"Lockout/tagout",full:"Lockout/tagout",plain:"Keeping equipment de-energized while people work on it.",m:"d2"},
 {k:"One-line diagram",full:"One-line (single-line) diagram",plain:"The electrical map of a plant, one line per connection.",m:"d3"},
 {k:"Bus",full:"Bus",plain:"A thick bar where circuits join.",m:"d3"},
 {k:"Feeder",full:"Feeder",plain:"A line that leaves the bus to equipment.",m:"d3"},
 {k:"As-built",full:"As-built drawing",plain:"A drawing of what was actually built.",m:"d3"},
 {k:"Frequency",full:"Frequency",plain:"How fast AC flips, 60 times a second in North America (60 Hz).",m:"d4"},
 {k:"Inertia",full:"Grid inertia",plain:"Motion energy in spinning generators that resists frequency change.",m:"d4"},
 {k:"IBR",full:"Inverter-Based Resource",plain:"Solar, wind, or batteries that connect through inverters.",m:"d4",q:1,grp:"gridtech"},
 {k:"Grid-following",full:"Grid-following inverter",plain:"An inverter that syncs to the grid signal that already exists.",m:"d4"},
 {k:"Grid-forming",full:"Grid-forming inverter",plain:"An inverter that can help create the grid signal and steady frequency.",m:"d4"},
 {k:"Reactive power",full:"Reactive power",plain:"Power that helps support voltage rather than doing work.",m:"d4"},
 {k:"Ride-through",full:"Ride-through",plain:"A plant stays online through certain voltage or frequency dips.",m:"d4"},
 {k:"STAR",full:"Situation, Task, Action, Result",plain:"A four-part way to tell an interview story.",m:"e1",q:1,grp:"interview"},
 {k:"Behavioral question",full:"Behavioral question",plain:"An interview question that asks for a real past example.",m:"e1"},
 {k:"Follow-up question",full:"Follow-up question",plain:"A deeper question that tests whether your example is real.",m:"e1"}

function rateTerm(k,ok,mod,cat){var w=S.terms[k]||(S.terms[k]={box:0,miss:0,seen:0,day:'',bonus:0}),first=w.day!==today();w.seen++;if(ok){w.box=Math.min(4,w.box+1);if(w.box>=3)w.miss=0}else{w.box=0;w.miss++}w.day=today();save();dailyBonus();if(first)award(ok?4:1,ok?'Term: got it':'Term: practiced','terms',mod);if(w.box>=3&&!w.bonus){w.bonus=1;award(5,'Term mastered','terms',mod)}}

/* ---------- sessions ---------- */
function pickFrom(list,n){var g={revisit:[],review:[],'new':[],know:[]};list.forEach(function(q){g[status(q.id)].push(q.id)});return shuffle(g.revisit).concat(shuffle(g.review),shuffle(g['new']),shuffle(g.know)).slice(0,n)}
function startSession(mod,force){
  if(mod==='smart'||mod==='final'){if(!unlockedQs().length){sess={gate:true,mod:mod};view='session';render();return}}
  else if(!S.done[mod]&&!force){sess={gate:true,mod:mod};view='session';render();return}
  var pool=mod==='smart'?unlockedQs():QS.filter(function(q){return q.m===mod}),con=pool.filter(function(q){return !q.gen}),trm=pool.filter(function(q){return q.gen});
  var ids=pickFrom(con,5);ids=ids.concat(pickFrom(trm,8-ids.length));if(ids.length<8)ids=ids.concat(pickFrom(pool.filter(function(q){return ids.indexOf(q.id)<0}),8-ids.length));
  sess={kind:'practice',mod:mod,queue:shuffle(ids),i:0,right:0,wrong:0,run:0,wrongRun:0,missed:[],tries:{},retried:{},answers:{},startXP:S.xp,empty:!ids.length};
  view='session';react='';if(!sess.empty)loadCur();owlAct('idle');render()}
function startFinal(){
  if(!coreDone()){sess={gate:true,mod:'final'};view='session';render();return}
  var ids=[],rest=[];CORE.forEach(function(m){var q=shuffle(modQs(m.id));ids=ids.concat(q.slice(0,2).map(function(x){return x.id}));rest=rest.concat(q.slice(2).map(function(x){return x.id}))});
  ids=shuffle(ids);if(ids.length<20)ids=ids.concat(shuffle(rest).slice(0,20-ids.length));ids=ids.slice(0,20);
  S.final.tries++;save();sess={kind:'final',mod:'final',queue:shuffle(ids),i:0,right:0,wrong:0,run:0,wrongRun:0,missed:[],tries:{},retried:{},answers:{},startXP:S.xp};
  view='session';react='';loadCur();owlAct('idle');render()}
function loadCur(){var q=QMAP[sess.queue[sess.i]],o=optionsFor(q);sess.cur={q:q,opts:o.opts,correct:o.correct,picked:null,hint:false};sess.phase='choose'}
function choose(i){if(!sess||sess.phase!=='choose')return;var c=sess.cur,id=c.q.id;c.picked=c.opts[i];var ok=c.picked===c.correct;sess.answers[id]=c.correct;sess.tries[id]=(sess.tries[id]||0)+1;
  if(sess.kind==='practice'){record(id,ok);dailyBonus()}
  if(ok){sess.right++;sess.run++;sess.wrongRun=0;react=sess.run===3||sess.run===5?pickNR('streak',D.streak):pickNR('right',D.right);owlAct('happy');tone([[660,.09],[880,.12]]);
    if(sess.kind==='practice')award(c.hint?7:(sess.tries[id]===1?10:5),c.hint?'Right (hint)':sess.tries[id]===1?'Right answer':'Right (retry)','quiz',sess.mod)}
  else{sess.wrong++;sess.run=0;sess.wrongRun++;sess.missed.push(id);react=pickNR('wrong',D.wrong)+(sess.wrongRun>=2&&sess.kind==='practice'?' Two in a row. Want a hint next time? Tap Hint, or ask me.':'');owlAct('oops');tone([[220,.18]]);
    if(sess.kind==='practice'&&!sess.retried[id]){sess.retried[id]=1;sess.queue.push(id)}}
  sess.phase='fb';render()}
function nextQ(){sess.i++;react='';if(sess.i>=sess.queue.length){finishSession()}else{loadCur();owlAct('idle')}render()}
function finishSession(){sess.phase='done';
  if(sess.kind==='final'){var tot=sess.queue.length,wrongN=new Set(sess.missed).size,score=Math.round(100*(tot-wrongN)/tot);sess.score=score;S.final.best=Math.max(S.final.best,score);S.final.date=today();var first=score>=80&&!S.final.passed;if(score>=80)S.final.passed=true;save();
    if(first){award(50,'Passed the Final Check','bonus');react=D.milestone[3];owlAct('cheer')}else{react=score>=80?'Passed again. Nice.':'Not yet. Review and try again. You can do this.';owlAct(score>=80?'happy':'think')}}
  else{award(10,'Quiz finished','quiz',sess.mod);if(sess.wrong===0&&sess.queue.length>=5)award(15,'Perfect quiz','quiz',sess.mod);if(sess.mod!=='smart'&&MODS[sess.mod]){S.qdone[sess.mod]=true;save()}react=pickNR('done',D.done);owlAct(sess.wrong===0?'cheer':'happy')}}

/* ---------- terms games ---------- */
function startHunt(mod){var pool=wpool(mod),g={revisit:[],review:[],'new':[],know:[]};pool.forEach(function(x){g[tstatus(x.k)].push(x.k)});var ids=shuffle(g.revisit).slice(0,3).concat(shuffle(g.review).slice(0,2),shuffle(g['new']));ids=ids.concat(shuffle(g.know)).slice(0,8);hunt={mod:mod,queue:ids,i:0,flip:false,knew:0,done:false,startXP:S.xp};if(!ids.length){view='terms';return render()}view='hunt';react='';owlAct('idle');render()}
function startMatch(mod){var pool=wpool(mod).filter(function(x){return x.plain.length<110}),g={nw:[],kn:[]};pool.forEach(function(x){(tstatus(x.k)==='know'?g.kn:g.nw).push(x.k)});var ids=shuffle(g.nw).concat(shuffle(g.kn)).slice(0,12);if(ids.length<4){view='terms';return render()}
  var rounds=[];for(var i=0;i+4<=ids.length;i+=4)rounds.push(ids.slice(i,i+4));match={mod:mod,rounds:rounds,r:0,solved:{},selK:null,order:shuffle(rounds[0]),done:false,startXP:S.xp};view='match';react='';owlAct('idle');render()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='nav'){view=b.dataset.v;sess=null;react=view==='learn'&&S.days.length?pickNR('greet',D.greet):'';owlAct('idle');render()}
  else if(a==='go'){goStep(nextStep())}
  else if(a==='lesson'){openLesson(b.dataset.m)}
  else if(a==='lnext'){les.i++;react='';markRead();render()}
  else if(a==='lback'){les.i--;react='';render()}
  else if(a==='lterms'){var ks=termKeys(les.m);if(ks.length){les.phase='terms';les.ti=0;les.flip=false;react='';render()}else{finishLesson();render()}}
  else if(a==='lflip'){les.flip=true;render()}
  else if(a==='lrate'){var k=termKeys(les.m)[les.ti];rateTerm(k,b.dataset.ok==='1',les.m);les.ti++;les.flip=false;if(les.ti>=termKeys(les.m).length)finishLesson();render()}
  else if(a==='practice'){startSession(b.dataset.m)}
  else if(a==='forceq'){startSession(b.dataset.m,true)}
  else if(a==='final'){startFinal()}
  else if(a==='choose'){choose(+b.dataset.i)}
  else if(a==='hint'){sess.cur.hint=true;render()}
  else if(a==='next'){nextQ()}
  else if(a==='cert'){view='cert';render()}
  else if(a==='hunt'){var sel=$('#wtopic');if(sel)wmod=sel.value;startHunt(wmod)}
  else if(a==='match'){var sel2=$('#wtopic');if(sel2)wmod=sel2.value;startMatch(wmod)}
  else if(a==='hflip'){hunt.flip=true;render()}
  else if(a==='hrate'){var hk=hunt.queue[hunt.i],ok=b.dataset.ok==='1';rateTerm(hk,ok,GMAP[hk].m);if(ok)hunt.knew++;hunt.i++;hunt.flip=false;if(hunt.i>=hunt.queue.length){hunt.done=true;award(10,'Flip cards finished','terms');owlAct('happy')}render()}
  else if(a==='mk'){match.selK=b.dataset.k;render()}
  else if(a==='mp'){if(!match.selK)return;if(match.selK===b.dataset.k){match.solved[match.selK]=true;award(3,'Matched a pair','terms',GMAP[match.selK].m);react='Yes. That pair is correct.';owlAct('happy');tone([[660,.09],[880,.12]])}else{react='Not that pair. Try another.';owlAct('oops');tone([[220,.18]])}match.selK=null;render()}
  else if(a==='mnext'){match.r++;if(match.r>=match.rounds.length){match.done=true;award(10,'Match finished','terms');owlAct('cheer')}else{match.order=shuffle(match.rounds[match.r]);match.solved={};match.selK=null}react='';render()}
  else if(a==='wf'){wfilter=b.dataset.f;render()}
  else if(a==='print'){window.print()}
  else if(a==='sound'){var on=S.set.music||S.set.sfx;S.set.music=!on;S.set.sfx=!on;save();applyAudio();hud();if(!on)tone([[660,.08],[880,.1]])}
  else if(a==='chat'){chat.open=!chat.open;if(chat.open&&!chat.log.length){owlSay(pickNR('greet',D.greet));owlSay('You can ask me about any term, or tap a button below.')}owlAct(chat.open?'wave':'idle');renderChat();var ci=$('#chatq');if(chat.open&&ci)ci.focus()}
  else if(a==='tip'){react=pickNR('tip',D.tips);owlAct('happy');renderBubble()}
  else if(a==='cq'){chip(b.dataset.q)}
  else if(a==='send'){var inp=$('#chatq');if(inp){var v=inp.value;inp.value='';respond(v)}}
  else if(a==='export'){var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='owlchi-progress-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();URL.revokeObjectURL(u)}
  else if(a==='import'){$('#imp').click()}
  else if(a==='reset'){if(confirm('Erase all progress and notes on this device?')){try{localStorage.removeItem(KEY)}catch(x){}S=defState();applyAudio();react='Fresh start.';render()}}
  else if(a==='copyprompt'){var done=function(){react='Prompt copied. Paste it into an AI assistant with your document.';renderBubble();popup('Prompt copied')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(PROMPT).then(done,function(){prompt('Copy this prompt:',PROMPT)});else prompt('Copy this prompt:',PROMPT)}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.set){S.set[t.dataset.set]=t.checked;save();applyAudio();nav();hud()}
  else if(t.id==='sz'){S.set.size=+t.value;save();nav()}
  else if(t.id==='wtopic'){wmod=t.value}
  else if(t.id==='imp'){var f=t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result),n=defState();for(var k in d){if(n[k]&&typeof n[k]==='object'&&!Array.isArray(n[k])&&['set','notes','pts','final'].indexOf(k)>=0){for(var j in d[k])n[k][j]=d[k][j]}else n[k]=d[k]}S=n;save();applyAudio();react='Progress imported.';render()}catch(x){alert('That file could not be read.')}};r.readAsText(f)}
  else if(t.id==='cfile'){var cf=t.files[0];if(!cf)return;var cr=new FileReader();cr.onload=function(){try{var cc=JSON.parse(cr.result);if(!validCourse(cc))throw 0;localStorage.setItem('owlchi.custom',JSON.stringify(cc));location.href=location.pathname+'?c=custom'}catch(x){alert('That file is not a valid course. Check it against the prompt shape.')}};cr.readAsText(cf)}
});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='wq'){wq=t.value.toLowerCase().trim();$('#wlist').innerHTML=wlist(wfiltered())}
  else if(t.id==='vol'){S.set.vol=+t.value;save();if(MU.master)MU.master.gain.value=0.5*S.set.vol}
  else if(t.id==='certname'){S.name=t.value;save();var d=$('#certdisp');if(d)d.textContent=t.value||'Your name'}
  else if(t.dataset&&t.dataset.note){S.notes[t.dataset.note]=t.value;save()}});
document.addEventListener('keydown',function(e){var tg=e.target.tagName;
  if(tg==='INPUT'&&e.target.id==='chatq'&&e.key==='Enter'){var v=e.target.value;e.target.value='';respond(v);return}
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;if(view!=='session'||!sess||sess.gate||sess.empty)return;
  if(sess.phase==='choose'&&/^[1-4]$/.test(e.key)){var i=+e.key-1;if(sess.cur.opts[i]!==undefined)choose(i)}
  else if(e.key==='Enter'&&tg!=='BUTTON'&&sess.phase==='fb')nextQ()});

/* ---------- start ---------- */
$('#ctitle').textContent=COURSE.title;
react=S.days.length?pickNR('greet',D.greet):D.greet[0];
setFrame('idle','bob');owlAct('wave');
render();
}
})();
</script>
